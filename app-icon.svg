<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#DC2626" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square App Icon Backing -->
  <rect width="512" height="512" rx="128" fill="#FFFFFF"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="4"/>

  <!-- Emergency Blood Droplet -->
  <g filter="url(#shadow)">
    <path d="M256 64 C256 64, 112 240, 112 336 C112 415.5, 176.5 480, 256 480 C335.5 480, 400 415.5, 400 336 C400 240, 256 64, 256 64 Z" fill="url(#bloodGrad)"/>
  </g>

  <!-- Medical Cross Symbol -->
  <rect x="232" y="270" width="48" height="130" rx="12" fill="#FFFFFF"/>
  <rect x="191" y="311" width="130" height="48" rx="12" fill="#FFFFFF"/>
  
  <!-- High gloss reflection on droplet -->
  <path d="M210 170 C240 120, 256 95, 256 95 C256 95, 160 220, 150 280 C145 250, 175 195, 210 170 Z" fill="#FFFFFF" opacity="0.35"/>
</svg>
